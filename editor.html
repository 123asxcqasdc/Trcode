<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор кода</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #1e1e1e;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 14px;
    overflow: hidden;
  }
  .editor-wrapper {
    display: flex;
    width: 100%;
    height: 100%;
  }
  .line-numbers {
    width: 50px;
    padding: 12px 8px 12px 0;
    text-align: right;
    color: #858585;
    background: #1e1e1e;
    line-height: 21px;
    user-select: none;
    overflow: hidden;
    border-right: 1px solid #2a2a2a;
  }
  .line-numbers div { height: 21px; }
  textarea {
    flex: 1;
    background: #1e1e1e;
    border: none;
    outline: none;
    resize: none;
    color: #d4d4d4;
    font-family: inherit;
    font-size: inherit;
    line-height: 21px;
    padding: 12px 12px 12px 10px;
    caret-color: #aeafad;
    overflow: auto;
    white-space: pre;
    tab-size: 4;
  }
  textarea::selection { background: #264f78; }
</style>
</head>
<body>

<div class="editor-wrapper">
  <div class="line-numbers" id="lineNumbers"></div>
  <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" wrap="off"></textarea>
</div>

<script>
(function () {
  const textarea = document.getElementById('code');
  const lineNumbers = document.getElementById('lineNumbers');

  const CHANGE_EVENT = 'code-editor:change';
  const LOAD_EVENT   = 'code-editor:load';
  const GET_EVENT    = 'code-editor:get';

  function updateLineNumbers() {
    const n = textarea.value.split('\n').length;
    let h = '';
    for (let i = 1; i <= n; i++) h += `<div>${i}</div>`;
    lineNumbers.innerHTML = h;
    lineNumbers.scrollTop = textarea.scrollTop;
  }

  function setCode(text) {
    textarea.value = text == null ? '' : String(text);
    updateLineNumbers();
    textarea.scrollTop = 0;
    lineNumbers.scrollTop = 0;
  }

  // Отправка: JSON-массив строк, разбитый по строкам кода.
  // Пример: ["<html>","  <body>","</html>"]
  function emitChange() {
    const payload = JSON.stringify(textarea.value.split('\n'));
    try { window.parent.postMessage(payload, '*'); } catch (e) {}
    window.dispatchEvent(new CustomEvent(CHANGE_EVENT, { detail: payload }));
  }

  // Приём: принимаем либо JSON-массив строк ["a","b"], либо "get", либо обёртку {type,data}
  window.addEventListener('message', (e) => {
    if (e.source === window) return;
    const raw = e.data;

    if (typeof raw === 'string') {
      // "get" — запрос текущего кода
      if (raw === 'get' || raw === GET_EVENT) { emitChange(); return; }

      // JSON-массив строк → склеиваем через \n
      let arr = null;
      try {
        const v = JSON.parse(raw);
        if (Array.isArray(v)) arr = v;
      } catch (err) {}
      if (arr) { setCode(arr.join('\n')); return; }

      // Обёртка {type,data}
      let wrap = null;
      try {
        const v = JSON.parse(raw);
        if (v && typeof v === 'object' && !Array.isArray(v)) wrap = v;
      } catch (err) {}
      if (wrap) { handleWrapped(wrap); return; }

      // Иначе — сырой текст как код
      setCode(raw);
      return;
    }

    if (raw && typeof raw === 'object') handleWrapped(raw);
  });

  function handleWrapped(msg) {
    if (msg.type === LOAD_EVENT) {
      let data = msg.data;
      if (typeof data === 'string') {
        try {
          const v = JSON.parse(data);
          if (Array.isArray(v)) data = v;
          else { setCode(msg.data); return; }
        } catch (err) { setCode(msg.data); return; }
      }
      if (Array.isArray(data)) setCode(data.join('\n'));
      else setCode(data);
    } else if (msg.type === GET_EVENT) {
      emitChange();
    }
  }

  textarea.addEventListener('input', () => {
    updateLineNumbers();
    emitChange();
  });

  textarea.addEventListener('scroll', () => {
    lineNumbers.scrollTop = textarea.scrollTop;
  });

  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = textarea.selectionStart, en = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, s) + '    ' + textarea.value.slice(en);
      textarea.selectionStart = textarea.selectionEnd = s + 4;
      updateLineNumbers();
      emitChange();
    }
  });

  window.CodeEditor = {
    load(arrOrStr) {
      if (typeof arrOrStr === 'string') {
        try {
          const v = JSON.parse(arrOrStr);
          if (Array.isArray(v)) { setCode(v.join('\n')); return; }
        } catch (err) {}
        setCode(arrOrStr);
      } else if (Array.isArray(arrOrStr)) {
        setCode(arrOrStr.join('\n'));
      }
    },
    get() {
      return JSON.stringify(textarea.value.split('\n'));
    }
  };

  updateLineNumbers();
  emitChange();
})();
</script>

</body>
</html>
