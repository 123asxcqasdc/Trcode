<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Editor [waiting for message...]</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1e1e1e; color: #d4d4d4;
    font-family: Consolas, monospace; font-size: 14px; overflow: hidden; }
  #wrap { display: flex; width: 100%; height: 100%; }
  #lines { width: 50px; padding: 12px 8px 12px 0; text-align: right;
    color: #858585; line-height: 21px; user-select: none;
    overflow: hidden; border-right: 1px solid #2a2a2a; }
  #lines div { height: 21px; }
  textarea { flex: 1; background: #1e1e1e; border: none; outline: none;
    resize: none; color: #d4d4d4; font-family: inherit; font-size: inherit;
    line-height: 21px; padding: 12px; caret-color: #aeafad;
    overflow: auto; white-space: pre; tab-size: 4; }
  #debug { position: fixed; bottom: 0; left: 0; right: 0; height: 140px;
    background: #111; color: #0f0; font-size: 11px; padding: 4px 8px;
    overflow: auto; border-top: 1px solid #333; white-space: pre-wrap; }
  #status { position: fixed; top: 0; left: 0; right: 0; height: 22px;
    background: #007acc; color: #fff; font-size: 12px; padding: 3px 8px;
    z-index: 10; }
</style>
</head>
<body>

<div id="status">init…</div>

<div id="wrap" style="padding-top:22px; padding-bottom:140px;">
  <div id="lines"></div>
  <textarea id="code" spellcheck="false" autocomplete="off" wrap="off"></textarea>
</div>

<div id="debug"></div>

<script>
(function () {
  const textarea = document.getElementById('code');
  const lines = document.getElementById('lines');
  const status = document.getElementById('status');
  const debug = document.getElementById('debug');

  const CHANGE_EVENT = 'code-editor:change';
  const LOAD_EVENT   = 'code-editor:load';
  const GET_EVENT    = 'code-editor:get';

  const log = (msg) => {
    const t = new Date().toISOString().substr(11, 12);
    debug.textContent += `[${t}] ${msg}\n`;
    debug.scrollTop = debug.scrollHeight;
    console.log('[EDITOR]', msg);
  };

  // --- Проверка окружения ---
  const inIframe = window.parent !== window;
  log('inIframe = ' + inIframe);
  log('location.href = ' + location.href);
  if (inIframe) {
    try { log('parent.location.href (может упасть из-за CORS) = ' + window.parent.location.href); }
    catch (e) { log('parent.location заблокирован (нормально для cross-origin)'); }
  }

  // --- UI ---
  function updateLines() {
    const n = textarea.value.split('\n').length;
    let h = '';
    for (let i = 1; i <= n; i++) h += `<div>${i}</div>`;
    lines.innerHTML = h;
    lines.scrollTop = textarea.scrollTop;
  }

  function setCode(text) {
    textarea.value = text == null ? '' : String(text);
    updateLines();
    log('setCode: ' + JSON.stringify(textarea.value).slice(0, 120));
    status.textContent = 'loaded ' + textarea.value.length + ' chars';
  }

  function emitChange(reason) {
    const payload = JSON.stringify([textarea.value]);
    log('emitChange (' + reason + ') -> ' + payload.slice(0, 120));
    try {
      window.parent.postMessage(payload, '*');
      log('  postMessage sent to parent');
    } catch (e) {
      log('  postMessage FAILED: ' + e.message);
    }
    try {
      window.dispatchEvent(new CustomEvent(CHANGE_EVENT, { detail: payload }));
    } catch (e) {}
  }

  // --- Приём сообщений ---
  window.addEventListener('message', (e) => {
    log('== message from ' + (e.source === window.parent ? 'PARENT' : e.source === window ? 'SELF' : 'OTHER') + ' | origin=' + e.origin);
    log('   data = ' + (() => {
      try { return JSON.stringify(e.data).slice(0, 200); }
      catch { return String(e.data).slice(0, 200); }
    })());

    if (e.source === window) return;

    const raw = e.data;
    let arr = null;

    if (typeof raw === 'string') {
      // пробуем как JSON-массив ["код"]
      try { const v = JSON.parse(raw); if (Array.isArray(v)) arr = v; } catch {}
      if (arr) { setCode(arr[0]); return; }
      // пробуем как обёртку {type, data}
      let wrap = null;
      try { const v = JSON.parse(raw); if (v && typeof v === 'object' && !Array.isArray(v)) wrap = v; } catch {}
      if (wrap) {
        if (wrap.type === LOAD_EVENT) {
          const a = typeof wrap.data === 'string' ? (() => { try { return JSON.parse(wrap.data); } catch { return null; } })() : wrap.data;
          setCode(Array.isArray(a) ? a[0] : wrap.data);
          return;
        }
        if (wrap.type === GET_EVENT) { emitChange('get'); return; }
      }
      if (raw === 'get' || raw === GET_EVENT) { emitChange('get'); return; }
      // иначе — просто код
      setCode(raw);
      return;
    }

    if (raw && typeof raw === 'object') {
      if (raw.type === LOAD_EVENT) {
        const a = typeof raw.data === 'string' ? (() => { try { return JSON.parse(raw.data); } catch { return null; } })() : raw.data;
        setCode(Array.isArray(a) ? a[0] : raw.data);
        return;
      }
      if (raw.type === GET_EVENT) { emitChange('get'); return; }
    }
  });

  // --- UI события ---
  textarea.addEventListener('input', () => { updateLines(); emitChange('input'); });
  textarea.addEventListener('scroll', () => { lines.scrollTop = textarea.scrollTop; });
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = textarea.selectionStart, en = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, s) + '    ' + textarea.value.slice(en);
      textarea.selectionStart = textarea.selectionEnd = s + 4;
      updateLines(); emitChange('tab');
    }
  });

  // --- Heartbeat: шлём код каждые 2 сек, чтобы в Scratch было видно ---
  setInterval(() => {
    emitChange('heartbeat');
  }, 2000);

  updateLines();
  emitChange('startup');
  log('editor ready');
})();
</script>
</body>
</html>
